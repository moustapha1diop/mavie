services:
  - type: web
    name: ma-vie-app
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # à définir manuellement dans le dashboard Render (secret)
      - key: JWT_SECRET
        generateValue: true # Render génère une valeur aléatoire sécurisée
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false        # à définir avec l'URL finale de ton service Render
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CLOUDINARY_CLOUD_NAME
        sync: false        # à définir manuellement (voir cloudinary.com/console)
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
